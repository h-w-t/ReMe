# =============================================================================
# ReMe AI Cloud Configuration — OpenBayes RTX 4090 24GB + Ollama
# =============================================================================
# Usage: reme backend=http http.port=8002 config_path=cloud_ollama
#
# Model layout (RTX 4090 24GB):
#   qwen3:8b  ~5 GB  → ReMe internal Ops (FrozenLake/BFCL/ToolMemory) + agent executor
#   text-embedding-qwen3-embedding-0.6b ~1 GB → all experiments
#   HaluMem LLMs: all via OpenRouter (gemini-2.5-flash / qwen3-max / qwen-plus-thinking)
#   Total Ollama VRAM ≈ 6 GB / 24 GB
# =============================================================================

backend: http
thread_pool_max_workers: 64

http:
  host: "0.0.0.0"
  port: 8002
  timeout_keep_alive: 600
  limit_concurrency: 64

# ── LLM configs ───────────────────────────────────────────────────────────────
llm:
  # Default: used by ALL ReMe internal Ops (FrozenLake/BFCL/ToolMemory summarize/retrieve)
  # HaluMem memory ops go through OpenRouter (qwen-plus-thinking), not this default
  default:
    backend: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ollama
    model_name: qwen3:8b
    params:
      temperature: 0.7
      max_tokens: 4096

  # Alias for agent executor (same model as default, kept for explicit reference)
  agent_8b:
    backend: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ollama
    model_name: qwen3:8b
    params:
      temperature: 0.7
      max_tokens: 4096

  # HaluMem: memory summarize/retrieve ops (via OpenRouter, keeps extra_body)
  # Key name aligns with reme/config/default.yaml and eval_reme.py
  qwen-plus-thinking:
    backend: openai_compatible
    base_url: ${OPENROUTER_BASE_URL}
    api_key: ${OPENROUTER_API_KEY}
    model_name: qwen/qwen-plus-2025-07-28:thinking
    extra_body:
      enable_thinking: true

# ── Embedding ─────────────────────────────────────────────────────────────────
embedding_model:
  default:
    backend: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ollama
    model_name: text-embedding-qwen3-embedding-0.6b
    params:
      dimensions: 1024

# ── Vector store ──────────────────────────────────────────────────────────────
vector_store:
  default:
    backend: local
    embedding_model: default
